version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: announcementextra-postgres
    environment:
      POSTGRES_DB: schedulingmanagementsystem_product_fullproduct
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "3050:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ae-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend/AnnouncementExtra
      dockerfile: Dockerfile
    container_name: announcementextra-backend
    environment:
      AMANAH_DB_URL: jdbc:postgresql://postgres:5432/schedulingmanagementsystem_product_fullproduct
      AMANAH_DB_USERNAME: postgres
      AMANAH_DB_PASSWORD: postgres123
      AMANAH_HOST_BE: 0.0.0.0
      AMANAH_PORT_BE: 7776
    ports:
      - "3060:7776"
    networks:
      - ae-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/announcement-extra
      dockerfile: Dockerfile
    container_name: announcementextra-frontend
    ports:
      - "3003:80"
    networks:
      - ae-network
    depends_on:
      - backend
    restart: unless-stopped

  reset:
    build:
      context: ./reset-service
      dockerfile: Dockerfile
    container_name: announcementextra-reset
    environment:
      DB_URL: postgresql://postgres:postgres123@postgres/schedulingmanagementsystem_product_fullproduct
    ports:
      - "3061:8080"
    networks:
      - ae-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

networks:
  ae-network:
    driver: bridge

volumes:
  postgres_data:
