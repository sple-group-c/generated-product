server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /call/ {
        proxy_pass http://backend:7776/call/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /static/appearance {
        alias /usr/share/nginx/html/static-json/appearance.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location ~ ^/static/static-data/([^/]+)$ {
        alias /usr/share/nginx/html/static-json/static-data/$1.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location = /static/static-data {
        alias /usr/share/nginx/html/static-json/static-data.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
