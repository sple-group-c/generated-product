server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy all backend API calls to the backend service
    location /call/ {
        proxy_pass http://backend:7776/call/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Serve appearance config (replaces json-server GET /appearance)
    location = /static/appearance {
        alias /usr/share/nginx/html/static-json/appearance.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Serve individual static-data entries (replaces json-server GET /static-data/:id)
    location ~ ^/static/static-data/([^/]+)$ {
        alias /usr/share/nginx/html/static-json/static-data/$1.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # Serve static-data list (replaces json-server GET /static-data)
    location = /static/static-data {
        alias /usr/share/nginx/html/static-json/static-data.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin *;
    }

    # SPA fallback — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
